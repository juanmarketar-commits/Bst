<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Gamer</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0f;--card:#16181f;--line:#2d313c;--tx:#eef1f7;--mu:#8f97a8;--red:#e11d2e;--cy:#2fa8ff;--gold:#d5dbe8;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(circle at 85% 0,#0d2338 0,transparent 45%),var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font:700 24px Rajdhani,sans-serif;font-style:italic;letter-spacing:.5px}.logo b{color:var(--red)}
.coins{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--gold);font-weight:600}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
nav{display:flex;border-top:1px solid var(--line);background:#0b0d13;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font:600 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}nav button.on{color:var(--cy)}
h2{font:700 22px Rajdhani,sans-serif;margin:2px 0 10px}
h3{font:700 17px Rajdhani,sans-serif}
.card{background:linear-gradient(160deg,#1d2029,#12141a);border:1px solid var(--line);border-top:2px solid var(--red);border-radius:4px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:20px;padding:6px 14px;font:600 13px Inter;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{background:linear-gradient(180deg,#f0283a,#a80f1d);color:#fff;border:0;border-radius:4px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:9px 18px;font:600 14px Inter;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--cy);color:var(--cy);clip-path:none}.btn.sm{padding:6px 10px;font-size:13px}
.btn:active{transform:scale(.97)}
input,select,textarea{width:100%;background:#0b0d13;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:15px Inter}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f1a);display:grid;place-items:center;font:700 17px Rajdhani;flex:none}
.av.c{background:linear-gradient(135deg,var(--cy),#0a6c8a);color:#021}
.tag{font-size:11px;background:#1b1f2c;color:var(--cy);padding:2px 8px;border-radius:8px;font-weight:600}
.act{display:flex;gap:18px;margin-top:8px;color:var(--mu)}.act button{background:none;border:0;color:inherit;font:600 13px Inter;cursor:pointer}.act .liked{color:var(--red)}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;margin-bottom:6px;background:#1b1f2c}.bub.me{background:var(--red);margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{text-align:center}.prod .ic{font-size:44px;height:70px;display:grid;place-items:center}
.price{color:var(--gold);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cy);color:#012;padding:9px 16px;border-radius:20px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:8}
#modal.on{display:flex}#sheet{background:#0f1118;width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;border-top:2px solid var(--red)}
canvas{width:100%;border-radius:14px;border:1px solid var(--line);background:#06090f;display:block}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:12px}.seg button{flex:1;background:none;border:0;color:var(--mu);padding:7px 0;border-radius:8px;font:600 13px Inter;cursor:pointer}.seg button.on{background:#1f2331;color:var(--tx)}
.banner{background:linear-gradient(120deg,#2a0509,#06222a);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app">
<header><div class="logo"><svg width="30" height="30" viewBox="0 0 40 40"><path d="M20 2l15 6v14c0 8-7 13-15 16C12 35 5 30 5 22V8z" fill="#16181f" stroke="#e11d2e" stroke-width="2.5"/><circle cx="20" cy="20" r="8" fill="#2fa8ff"/><circle cx="20" cy="20" r="3.5" fill="#06121c"/><path d="M12 12l16 16" stroke="#e11d2e" stroke-width="2"/></svg><span>BEST <b>GAMER</b></span></div><div class="coins" id="coins"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<div id="toast"></div>
<div id="modal"><div id="sheet"></div></div>
<script>
var S={tab:'inicio',news:'Todos',sub:{equipos:'chat',tienda:'tienda'},coins:100,cart:[],
posts:[
{id:1,n:'Centinelas',t:'Ganamos la liga de Clash Royale. Gracias a toda la torcida.',p:'Mobile',l:128,liked:0,c:14},
{id:2,n:'NovaPlay',t:'Nuevo clip: ace en la final de PC. Miren la jugada.',p:'PC',l:86,liked:0,c:9},
{id:3,n:'Liga Console BR',t:'Abren inscripciones para el torneo de consola de noviembre.',p:'Consola',l:54,liked:0,c:5},
{id:4,n:'Kira Streams',t:'Hoy transmito en vivo desde la Arena del metaverso.',p:'PC',l:203,liked:0,c:31}],
chat:[{m:0,t:'Entrenamiento a las 20:00 en la arena de práctica.',u:'Coach'},{m:0,t:'Listo, ahí estaré.',u:'Lobo'}],

roster:[['Dan','Capitán','Activo'],['Lobo','Jugador','Activo'],['Maya','Jugadora','Activo'],['Rafa','Staff','Activo'],['Cris','Diseñador','Pendiente']],
mk:[{n:'ShadowX',r:'Jugador Free Fire',s:'Disponible',pr:'R$ 1.800/mes'},{n:'Mika',r:'Jugadora Clash Royale',s:'Disponible',pr:'R$ 2.200/mes'},{n:'PixelCris',r:'Diseñador virtual',s:'Por encargo',pr:'R$ 150/diseño'},{n:'Tanque',r:'Jugador Brawl Stars',s:'Negociando',pr:'R$ 1.500/mes'}],
mkf:'Todos',
shop:[{id:'a',n:'Camiseta Centinela',e:'👕',p:25},{id:'b',n:'Gorra Best Gamer',e:'🧢',p:15},{id:'c',n:'Skin Guerrero',e:'🛡️',p:5},{id:'d',n:'Pass Royale',e:'👑',p:10},{id:'e',n:'Emblema Dorado',e:'🏅',p:5},{id:'f',n:'Casco Espartano',e:'⛑️',p:8}],

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},1900)}
var TABS=[['inicio','🏠','Inicio'],['equipos','👥','Equipos'],['mercado','🤝','Mercado'],['tienda','🛍️','Tienda'],['meta','🌐','Metaverso']];
function nav(){$('nav').innerHTML=TABS.map(function(t){return '<button class="'+(S.tab==t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');$('coins').textContent='🪙 '+S.coins}
function seg(k,items){return '<div class="seg">'+items.map(function(i){return '<button class="'+(S.sub[k]==i[0]?'on':'')+'" data-a="sub" data-k="'+k+'" data-v="'+i[0]+'">'+i[1]+'</button>'}).join('')+'</div>'}
function vInicio(){
var f=['Todos','Mobile','Consola','PC'];
var h='<div class="banner"><h3>Best Gamer, todos los mundos en todas las plataformas</h3><div class="mu">La red social del gaming competitivo. Publica, comparte y conecta.</div></div>';
h+='<div class="card"><textarea id="np" rows="2" placeholder="Comparte tu jugada, clip o noticia..."></textarea><div class="row sp" style="margin-top:8px"><select id="npp" style="width:auto"><option>Mobile</option><option>Consola</option><option>PC</option></select><button class="btn sm" data-a="post">Publicar</button></div></div>';
h+='<h2>Noticias competitivas</h2><div class="chips">'+f.map(function(x){return '<button class="chip '+(S.news==x?'on':'')+'" data-a="news" data-v="'+x+'">'+(x=='PC'?'PC/Emulador':x)+'</button>'}).join('')+'</div>';
var ps=S.posts.filter(function(p){return S.news=='Todos'||p.p==S.news});
if(!ps.length)h+='<div class="card mu">No hay publicaciones en esta categoría. Sé el primero en publicar.</div>';
h+=ps.map(function(p){return '<div class="card"><div class="row"><div class="av">'+esc(p.n[0])+'</div><div><b>'+esc(p.n)+'</b><div class="mu"><span class="tag">'+p.p+'</span></div></div></div><p style="margin-top:8px">'+esc(p.t)+'</p><div class="act"><button class="'+(p.liked?'liked':'')+'" data-a="like" data-v="'+p.id+'">'+(p.liked?'❤️':'🤍')+' '+p.l+'</button><button data-a="msg" data-v="Próximamente: comentarios">💬 '+p.c+'</button><button data-a="share" data-v="'+p.id+'">🔗 Compartir</button></div></div>'}).join('');
return h}
function vEquipos(){
var h='<h2>Mi equipo</h2>'+seg('equipos',[['chat','Chat'],['cal','Calendario'],['plantel','Plantel']]);
var s=S.sub.equipos;
if(s=='chat'){h+='<div class="card" id="chatbox" style="height:300px;overflow-y:auto">'+S.chat.map(function(c){return '<div class="bub '+(c.m?'me':'')+'">'+(c.m?'':'<div class="mu">'+esc(c.u)+'</div>')+esc(c.t)+'</div>'}).join('')+'</div><div class="row"><input id="ci" placeholder="Escribe un mensaje" maxlength="200"><button class="btn" data-a="send">Enviar</button></div><div class="row" style="margin-top:10px"><button class="btn alt sm" data-a="voice">🎙️ Entrar a sala de voz</button></div>'}
if(s=='cal'){h+=S.ev.map(function(e){return '<div class="card row sp"><div><b>'+esc(e.t)+'</b><div class="mu">'+esc(e.d)+' · '+esc(e.h)+'</div></div><span class="tag">Compartido</span></div>'}).join('')+'<div class="card"><h3>Agregar evento</h3><input id="et" placeholder="Nombre del evento" style="margin:8px 0"><div class="row"><input id="ed" placeholder="Día (ej. Lun 20)"><input id="eh" placeholder="Hora"></div><button class="btn" style="margin-top:8px;width:100%" data-a="addev">Agregar al calendario</button></div>'}
if(s=='plantel'){h+='<div class="card"><table><tr><th>Nombre</th><th>Función</th><th>Estado</th></tr>'+S.roster.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join('')+'</table></div><div class="card"><div class="row"><input id="rn" placeholder="Nombre"><select id="rr" style="width:auto"><option>Jugador</option><option>Staff</option><option>Socio</option><option>Diseñador</option></select></div><button class="btn" style="margin-top:8px;width:100%" data-a="addr">Agregar al plantel</button></div>'}
return h}
function vMercado(){
var f=['Todos','Jugador','Diseñador'];
var h='<h2>Negociación y divulgación</h2><div class="mu" style="margin-bottom:10px">Encuentra jugadores, equipos y diseñadores. Chat cifrado y pre-contrato dentro de la app.</div><div class="chips">'+f.map(function(x){return '<button class="chip '+(S.mkf==x?'on':'')+'" data-a="mkf" data-v="'+x+'">'+x+'</button>'}).join('')+'</div>';
h+=S.mk.filter(function(m){return S.mkf=='Todos'||m.r.indexOf(S.mkf)>-1}).map(function(m,i){return '<div class="card row"><div class="av c">'+m.n[0]+'</div><div style="flex:1"><b>'+m.n+'</b><div class="mu">'+m.r+'</div><div class="mu"><span class="tag">'+m.s+'</span> '+m.pr+'</div></div><button class="btn sm" data-a="neg" data-v="'+S.mk.indexOf(m)+'">Negociar</button></div>'}).join('');
return h}
function vTienda(){
var h='<h2>Tienda y Closet</h2>'+seg('tienda',[['tienda','Tienda'],['closet','Best Closet']]);
if(S.sub.tienda=='tienda'){h+='<div class="grid">'+S.shop.map(function(p){return '<div class="card prod"><div class="ic">'+p.e+'</div><div>'+p.n+'</div><div class="price">🪙 '+p.p+'</div><button class="btn sm" style="margin-top:8px;width:100%" data-a="add" data-v="'+p.id+'">Agregar</button></div>'}).join('')+'</div>';
var tot=S.cart.reduce(function(a,id){return a+S.shop.filter(function(p){return p.id==id})[0].p},0);
h+='<div class="card"><h3>Carrito ('+S.cart.length+')</h3>'+(S.cart.length?'<div class="mu" style="margin:6px 0">'+S.cart.map(function(id){return S.shop.filter(function(p){return p.id==id})[0].n}).join(', ')+'</div><div class="row sp"><span class="price">Total: 🪙 '+tot+'</span><span><button class="btn alt sm" data-a="clr">Vaciar</button> <button class="btn sm" data-a="pay">Pagar</button></span></div>':'<div class="mu">Tu carrito está vacío. Agrega productos para comprar.</div>')+'</div>'}
else{var T=['👕 Camiseta Centinela','🧥 Chaqueta negra','🎽 Camiseta Best Gamer'],A=['🧢 Gorra','🎧 Auriculares','🕶️ Lentes'];
h+='<div class="card" style="text-align:center"><div style="font-size:70px">🧍</div><div style="font-size:34px;margin:-6px 0 6px">'+T[S.closet.top].split(' ')[0]+' '+A[S.closet.acc].split(' ')[0]+'</div><div class="mu">Pruébate combinaciones antes de comprar</div></div><div class="card"><b>Prenda</b><div class="chips" style="margin-top:8px">'+T.map(function(x,i){return '<button class="chip '+(S.closet.top==i?'on':'')+'" data-a="ct" data-v="'+i+'">'+x+'</button>'}).join('')+'</div><b>Accesorio</b><div class="chips" style="margin-top:8px">'+A.map(function(x,i){return '<button class="chip '+(S.closet.acc==i?'on':'')+'" data-a="ca" data-v="'+i+'">'+x+'</button>'}).join('')+'</div><button class="btn" style="width:100%" data-a="msg" data-v="Look guardado en tu closet">Guardar look</button></div>'}
return h}
function vMeta(){
var h='<h2>Metaverso · Universo Best</h2><canvas id="cv" width="440" height="260"></canvas><div class="row" style="margin:10px 0"><button class="btn" data-a="cheer">📣 Aplaudir</button><button class="btn alt" data-a="msg" data-v="El modo VR estará disponible en PC">🥽 Modo VR</button><button class="btn alt" data-a="msg" data-v="Próximamente: avenida de sedes">🏢 Avenida</button></div><div class="mu" id="cheerc" style="margin-bottom:12px">Torcida presente: <b id="fans">0</b></div><h2>Apuestas</h2><div class="mu" style="margin-bottom:8px">Apuesta 10 🪙 por partida y multiplica tus monedas.</div>';
h+=S.bets.map(function(b){var m=S.mybets[b.id];return '<div class="card"><div class="row sp"><b>'+b.a+' vs '+b.b+'</b>'+(m?'<span class="tag">Apostaste: '+m+'</span>':'')+'</div><div class="row" style="margin-top:8px"><button class="btn sm" style="flex:1" data-a="bet" data-v="'+b.id+'|'+b.a+'">'+b.a+' ×'+b.oa+'</button><button class="btn alt sm" style="flex:1" data-a="bet" data-v="'+b.id+'|'+b.b+'">'+b.b+' ×'+b.ob+'</button></div></div>'}).join('');
return h}
var raf=0,fans=[],cheer=0;
function arena(){var c=$('cv');if(!c)return;var x=c.getContext('2d');
if(!fans.length){for(var i=0;i<70;i++){var a=i/70*6.283,r=i%2?105:122;fans.push({a:a,r:r,c:['#e11d2e','#2fa8ff','#aab4c6','#fff'][i%4],o:Math.random()*6})}}
var t=0;(function f(){if(!$('cv'))return;t+=.05;x.clearRect(0,0,440,260);
x.fillStyle='#0a1c2e';x.fillRect(150,95,140,70);x.strokeStyle='#2fa8ff';x.strokeRect(150,95,140,70);x.beginPath();x.moveTo(220,95);x.lineTo(220,165);x.stroke();x.beginPath();x.arc(220,130,14,0,6.283);x.stroke();
x.strokeStyle='#232736';x.beginPath();x.ellipse(220,130,175,110,0,0,6.283);x.stroke();
var n=Math.min(70,20+cheer);fans.forEach(function(p,i){if(i>=n)return;var px=220+Math.cos(p.a)*p.r*1.45,py=130+Math.sin(p.a)*p.r*.9-Math.abs(Math.sin(t*(1+cheer/30)+p.o))*(3+cheer/6);x.fillStyle=p.c;x.beginPath();x.arc(px,py,5,0,6.283);x.fill()});
x.fillStyle='#eef0f6';x.font='700 13px Rajdhani,sans-serif';x.fillText('ARENA BEST GAMER',165,20);
var e=$('fans');if(e)e.textContent=n;
raf=requestAnimationFrame(f)})()}
function render(){cancelAnimationFrame(raf);var v={inicio:vInicio,equipos:vEquipos,mercado:vMercado,tienda:vTienda,meta:vMeta}[S.tab];var m=$('main'),y=m.scrollTop;m.innerHTML=v();m.scrollTop=y;nav();if(S.tab=='meta')arena();var cb=$('chatbox');if(cb)cb.scrollTop=9999}
function sheet(h){$('sheet').innerHTML=h;$('modal').className='on'}
function closeM(){$('modal').className=''}
function find(a,id){return a.filter(function(p){return p.id==id})[0]}
var A={
tab:function(v){S.tab=v;$('main').scrollTop=0;render()},
sub:function(v,d){S.sub[d.k]=v;render()},
news:function(v){S.news=v;render()},
like:function(v){var p=find(S.posts,v);p.liked=!p.liked;p.l+=p.liked?1:-1;render()},
share:function(v){var p=find(S.posts,v);var t=p.n+': '+p.t;if(navigator.share){navigator.share({text:t}).catch(function(){})}else toast('Enlace copiado para compartir')},
msg:function(v){toast(v)},
post:function(){var t=$('np').value.trim();if(!t)return toast('Escribe algo antes de publicar');S.posts.unshift({id:Date.now(),n:'Tú',t:t,p:$('npp').value,l:0,liked:0,c:0});S.news='Todos';toast('Publicado');render()},
send:function(){var i=$('ci'),t=i.value.trim();if(!t)return;S.chat.push({m:1,t:t});render();setTimeout(function(){S.chat.push({m:0,t:['¡Recibido!','Perfecto, nos vemos ahí.','Buena idea, lo anoto.'][S.chat.length%3],u:'Lobo'});if(S.tab=='equipos'&&S.sub.equipos=='chat')render()},900)},
voice:function(){toast('Conectado a la sala de voz')},
addev:function(){var t=$('et').value.trim();if(!t)return toast('Escribe el nombre del evento');S.ev.push({t:t,d:$('ed').value||'Por definir',h:$('eh').value||'--:--'});toast('Evento agregado');render()},
addr:function(){var n=$('rn').value.trim();if(!n)return toast('Escribe un nombre');S.roster.push([n,$('rr').value,'Pendiente']);toast('Agregado al plantel');render()},
mkf:function(v){S.mkf=v;render()},
neg:function(v){var m=S.mk[v];sheet('<div class="row sp"><h3>Negociar con '+m.n+'</h3><button class="chip" data-a="close">Cerrar</button></div><div class="mu" style="margin:4px 0 10px">🔒 Chat cifrado de extremo a extremo</div><div class="card"><b>Pre-contrato editable</b><div class="mu" style="margin:6px 0">'+m.r+'</div><input id="cm" value="'+m.pr.replace(/"/g,'')+'" style="margin-bottom:8px"><select id="cd"><option>3 meses</option><option>6 meses</option><option>12 meses</option></select></div><button class="btn" style="width:100%;margin-bottom:8px" data-a="offer" data-v="'+v+'">Enviar propuesta</button><button class="btn alt" style="width:100%" data-a="msg" data-v="Próximamente: pagos de salarios y contratos">💳 Configurar pagos</button>')},
offer:function(v){var m=S.mk[v];m.s='Negociando';closeM();toast('Propuesta enviada a '+m.n);render()},
close:function(){closeM()},
add:function(v){S.cart.push(v);toast('Agregado al carrito');render()},
clr:function(){S.cart=[];render()},
pay:function(){var tot=S.cart.reduce(function(a,id){return a+find(S.shop,id).p},0);if(tot>S.coins)return toast('Monedas insuficientes: te faltan '+(tot-S.coins));S.coins-=tot;S.cart=[];toast('Compra realizada. ¡Gracias!');render()},
ct:function(v){S.closet.top=+v;render()},ca:function(v){S.closet.acc=+v;render()},
